<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Hira 💌</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd6e7, #d9c2ff);
  overflow: hidden;
}

.container {
  text-align: center;
}

h1 {
  color: #ff4f91;
  margin-bottom: 30px;
}

.envelope {
  width: 280px;
  height: 180px;
  background: #ff709f;
  position: relative;
  margin: auto;
  cursor: pointer;
  border-radius: 8px;
  box-shadow: 0 15px 30px rgba(0,0,0,.2);
}

.envelope::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  border-left: 140px solid transparent;
  border-right: 140px solid transparent;
  border-top: 100px solid #ff9cbd;
  z-index: 2;
}

.letter {
  position: absolute;
  width: 240px;
  height: 150px;
  background: white;
  left: 20px;
  top: 15px;
  padding: 20px;
  border-radius: 5px;
  transition: .8s;
  z-index: 1;
  color: #555;
}

.envelope.open .letter {
  transform: translateY(-120px);
}

.message {
  margin-top: 150px;
  font-size: 18px;
  color: #555
